<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LARARADICS — Fade</title>
<style>
  footer{ padding:32px 6vw 40px; font-size:6px; letter-spacing:.05em; text-transform:uppercase; color:var(--stone); text-align:center; }
  img{ -webkit-user-select:none; user-select:none; -webkit-user-drag:none; }
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap');
  :root{ --paper:#FFFFFF; --ink:#111110; --stone:#6E6B65; --line: rgba(17,17,16,0.09); --gap: 12px; --header-h: 56px; --footer-h: 48px; --vh: 1vh; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{ background:var(--paper); color:var(--ink); font-family:'Archivo', sans-serif; -webkit-font-smoothing:antialiased; }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 6vw; height:var(--header-h);
    position:fixed; top:0; left:0; right:0; z-index:15;
    background:var(--paper);
  }
  .mark{ font-weight:600; font-size:13px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; color:var(--ink); }
  nav{display:flex; gap:28px;}
  nav a{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); opacity:.72; text-decoration:none; }
  nav a:hover{opacity:1;}
  nav a.active{ opacity:1; font-weight:600; }

  .fade-outer{ position:relative; } /* height set by JS based on actual slide count */
  .fade-sticky{ position:sticky; top: var(--header-h); height: calc(var(--vh) * 100 - var(--header-h)); overflow:hidden; }

  .page{
    position:absolute; inset:0;
    opacity:0;
    transition: opacity .7s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .page.align-left{ justify-content:flex-start; }
  .page.align-right{ justify-content:flex-end; }
  .page.active{ opacity:1; z-index:1; }

  .page.full img{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; }

  .page.offset{ padding: 6vh 12vw; }
  .page.offset img{ max-width:64vw; max-height:100%; width:auto; height:auto; object-fit:contain; box-shadow:0 30px 60px rgba(0,0,0,.08); }

  .page.trio .trio-grid{ display:flex; align-items:center; gap:var(--gap); width:100%; height:100%; padding:4vh 6vw; }
  .page.trio .t1{ flex:1.4; height:100%; display:flex; align-items:center; justify-content:center; }
  .page.trio .t2{ flex:1; height:82%; display:flex; align-items:center; justify-content:center; }
  .page.trio .t3{ flex:0.8; height:64%; display:flex; align-items:center; justify-content:center; }
  .page.trio .trio-grid img{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; }

  /* phone nav — wrap onto its own row with real spacing instead of squeezing one line */
  @media (max-width:480px){
    :root{ --header-h: 96px; }
    header{ flex-direction:column; align-items:flex-start; justify-content:center; gap:10px; padding:12px 6vw; }
    nav{ gap:18px; }
  }
</style>
</head>
<body>
  <header>
    <a href="index.html" class="mark">LARARADICS</a>
    <nav><a href="architecture.html">Architecture</a><a href="people.html">People</a><a href="motion.html">Motion</a><a href="info.html">Info</a></nav>
  </header>

  <section class="fade-outer" id="fadeOuter">
    <div class="fade-sticky" id="fadeSticky"></div>
  </section>

  <script>
  </script>

  <script>
    function src(name){ return 'images/' + name; }

    // content is described once — mobile automatically flattens any "group" into single-image slides
    const compositions = [
      { type:'offset',images:['IMG_01.jpg'] },
      { type:'full',images:['IMG_02.jpg'], align:'left' },
      { type:'offset',images:['IMG_03.jpeg'], align:'right' },
      { type:'offset',  images:['IMG_04.jpg'], align:'center' },
      { type:'full',  images:['IMG_05.jpg'], align:'left' },
      { type:'offset',  images:['IMG_06.jpeg'], align:'right' },
      { type:'offset',  images:['IMG_07.jpeg'], align:'center' },
      { type:'full',  images:['IMG_08.jpeg'], align:'left' },

    ];

    function isMobile(){ return window.innerWidth <= 820; }

    function buildSlides(){
      const sticky = document.getElementById('fadeSticky');
      sticky.innerHTML = '';
      const mobile = isMobile();
      let slides = [];

      compositions.forEach(comp => {
        if (comp.type === 'group' && mobile){
          // split the group into separate one-image slides on phone
          comp.images.forEach((img) => {
            slides.push({ type:'full', images:[img] });
          });
        } else {
          slides.push(comp);
        }
      });

      slides.forEach((s, i) => {
        const page = document.createElement('div');
        page.className = 'page ' + s.type + (s.align ? ' align-' + s.align : '');
        page.dataset.i = i;

        if (s.type === 'group'){
          const grid = document.createElement('div');
          grid.className = 'trio-grid';
          const cls = ['t1','t2','t3'];
          s.images.forEach((img, idx) => {
            const wrap = document.createElement('div');
            wrap.className = cls[idx] || 't3';
            const im = document.createElement('img');
            im.src = src(img);
            wrap.appendChild(im);
            grid.appendChild(wrap);
          });
          page.appendChild(grid);
        } else {
          const im = document.createElement('img');
          im.src = src(s.images[0]);
          page.appendChild(im);
        }

        sticky.appendChild(page);
      });

      return slides.length;
    }

    let pages = [];
    const outer = document.getElementById('fadeOuter');

    function layout(){
      const n = buildSlides();
      pages = Array.from(document.querySelectorAll('.page'));
      outer.style.height = `calc(var(--vh) * 100 * ${n})`;
      pages[0] && pages[0].classList.add('active');
      updateProgress();
    }

    function updateProgress(){
      const rect = outer.getBoundingClientRect();
      const total = outer.offsetHeight - window.innerHeight;
      const scrolled = Math.min(Math.max(-rect.top, 0), total);
      const progress = total > 0 ? scrolled / total : 0;
      const n = pages.length;
      let idx = Math.round(progress * (n - 1));
      idx = Math.min(Math.max(idx, 0), n - 1);
      pages.forEach((p, i) => p.classList.toggle('active', i === idx));
    }

    function setVh(){
      const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
    }

    let lastMobile = isMobile();
    setVh();
    layout();

    window.addEventListener('scroll', updateProgress, { passive:true });
    window.addEventListener('resize', () => {
      setVh();
      const nowMobile = isMobile();
      if (nowMobile !== lastMobile){
        lastMobile = nowMobile;
        layout(); // rebuild slide list if crossing the phone/desktop breakpoint
      } else {
        updateProgress();
      }
    });
    if (window.visualViewport){
      window.visualViewport.addEventListener('resize', () => { setVh(); updateProgress(); });
    }
  </script>
<footer>&copy; <span id="year"></span> LARARADICS. All rights reserved.</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  document.addEventListener('contextmenu', function(e){ if (e.target.tagName === 'IMG') e.preventDefault(); });
</script>
</body>
</html>
