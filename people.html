<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People — LARARADICS</title>
<meta name="description" content="Portrait and event photography by Laura Radics — Basel-based architect and photographer.">
<link rel="canonical" href="https://lararadics.studio/people">

<meta property="og:type" content="website">
<meta property="og:title" content="People — LARARADICS">
<meta property="og:description" content="Portrait and event photography by Laura Radics — Basel-based architect and photographer.">
<meta property="og:url" content="https://lararadics.studio/people">
<meta property="og:image" content="https://lararadics.studio/images/thumbs/IMG_P_1_04.jpg">
<meta property="og:site_name" content="LARARADICS">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="People — LARARADICS">
<meta name="twitter:image" content="https://lararadics.studio/images/thumbs/IMG_P_1_04.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  footer{ padding:32px 6vw 40px; font-size:6px; letter-spacing:.05em; text-transform:uppercase; color:var(--stone); text-align:center; }
  .footer-tagline{ font-size:11px; letter-spacing:.03em; text-transform:none; color:var(--stone); opacity:.75; margin-bottom:12px; }
  img{ -webkit-user-select:none; user-select:none; -webkit-user-drag:none; }
  :root{ --paper:#FFFFFF; --ink:#111110; --stone:#6E6B65; --line: rgba(17,17,16,0.09); --gap: 12px; --header-h: 56px; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Archivo', sans-serif; -webkit-font-smoothing:antialiased; }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 6vw; height:var(--header-h);
    position:sticky; top:0; z-index:15;
    background:var(--paper);
  }
  .mark{ font-weight:600; font-size:13px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; color:var(--ink); }
  nav{display:flex; gap:32px;}
  nav a{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); opacity:.72; text-decoration:none; }
  nav a:hover{opacity:1;}
  nav a.active{opacity:1; font-weight:600;}
  .lang-btn{ background:none; border:none; font:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); opacity:.72; cursor:pointer; padding:0; }
  .lang-btn:hover{ opacity:1; }

  .category{ padding:6vh 6vw 10vh; }

  .project-row{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); column-gap:20px; row-gap:56px; }
  .p-link{ display:block; text-decoration:none; color:inherit; cursor:pointer; }
  .p-cell{ position:relative; overflow:hidden; aspect-ratio:4/5; }
  .p-cell img{ width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1) opacity(.55); transition:filter .45s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
  .p-link:hover .p-cell img{ filter:grayscale(0) opacity(1); transform:scale(1.015); }
  .p-title{ margin-top:12px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); opacity:.55; transition:opacity .3s ease; }
  .p-link:hover .p-title{ opacity:1; }

  @media (max-width:480px){
    header{ flex-direction:column; align-items:flex-start; justify-content:center; gap:10px; padding:12px 6vw; height:auto; }
    nav{ gap:18px; }
  }
</style>
</head>
<body>

  <header>
    <a href="index.html" class="mark">LARARADICS</a>
    <nav>
      <a href="architecture.html" data-i18n="nav_architecture">Architecture</a>
      <a href="#" class="active" data-i18n="nav_people">People</a>
      <a href="motion.html" data-i18n="nav_motion">Motion</a>
      <a href="info.html" data-i18n="nav_info">Info</a>
      <button id="langToggle" class="lang-btn" onclick="i18nToggle()">DE</button>
    </nav>
  </header>

  <section class="category">
    <div class="project-row">
      <a class="p-link" href="project.html?p=DayOfTheBathers">
        <div class="p-cell"><img src="images/thumbs/IMG_P_1_04.jpg" alt="Day of the Bathers — portrait photography by Laura Radics" decoding="async" fetchpriority="high"></div>
        <div class="p-title">DAY OF THE BATHERS</div>
      </a>
      <a class="p-link" href="project.html?p=Wedding">
        <div class="p-cell"><img src="images/thumbs/IMG_P_2_07.jpg" alt="Wedding photography by Laura Radics" loading="lazy" decoding="async"></div>
        <div class="p-title">WEDDING</div>
      </a>
    </div>
  </section>

  <footer><div class="footer-tagline" data-i18n="tagline">Architecture, Photography &amp; Videography — Laura Radics, Basel</div>&copy; <span id="year"></span> LARARADICS. <span data-i18n="footer_rights">All rights reserved.</span></footer>

  <script src="i18n.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    document.addEventListener('contextmenu', function(e){ if (e.target.tagName === 'IMG') e.preventDefault(); });
    i18nApply(localStorage.getItem('site-lang') || 'en');
  </script>
</body>
</html>
