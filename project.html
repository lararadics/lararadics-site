<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — LARARADICS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap');
  :root{ --paper:#FFFFFF; --ink:#111110; --stone:#6E6B65; --line: rgba(17,17,16,0.09); --gap: 12px; --header-h: 56px; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Archivo', sans-serif; -webkit-font-smoothing:antialiased; }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 6vw; height:var(--header-h);
    position:sticky; top:0; z-index:15;
    background:var(--paper);
  }
  .mark{ font-weight:600; font-size:13px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; color:var(--ink); }
  nav{display:flex; gap:32px;}
  nav a{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); opacity:.72; text-decoration:none; }
  nav a:hover{opacity:1;}

  .p-header{ padding:6vh 6vw 4vh; }
  .p-back{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--stone); text-decoration:none; }
  .p-back:hover{ color:var(--ink); }
  .p-title{ font-size:clamp(26px,3.4vw,42px); font-weight:500; margin-top:16px; }

.montage{ padding:0 6vw 12vh; column-count:3; column-gap:24px; }
.m-cell{ break-inside:avoid; margin-bottom:24px; }
.m-cell img{ width:100%; height:auto; display:block; }

@media (max-width:720px){
  .montage{ column-count:1; }
}

  @media (max-width:480px){
    header{ flex-direction:column; align-items:flex-start; justify-content:center; gap:10px; padding:12px 6vw; height:auto; }
    nav{ gap:18px; }
  }
</style>
</head>
<body>

  <header>
    <a href="index.html" class="mark">LARARADICS</a>
    <nav>
      <a href="architecture.html">Architecture</a>
      <a href="people.html">People</a>
      <a href="motion.html">Motion</a>
      <a href="info.html">Info</a>
    </nav>
  </header>

  <div class="p-header">
    <a class="p-back" href="work.html" id="backLink">← Back</a>
    <div class="p-title" id="projectTitle"></div>
  </div>

  <div class="montage" id="montage"></div>

  <script>

    function src(name){ return 'images/' + name; }

const PROJECTS = {
  Paris: { title: 'PARIS', category: 'architecture', images: ['IMG_A_1_01.jpeg', 'IMG_A_1_02.jpeg', 'IMG_A_1_03.jpeg', 'IMG_A_1_04.jpeg', 'IMG_A_1_05.jpeg', 'IMG_A_1_06.jpeg'] },
  NewYork: { title: 'NEW YORK', category: 'architecture', images: ['IMG_A_2_01.jpeg', 'IMG_A_2_02.jpeg', 'IMG_A_2_03.jpeg', 'IMG_A_2_04.jpeg', 'IMG_A_2_05.jpeg', 'IMG_A_2_06.jpeg', 'IMG_A_2_07.jpeg', 'IMG_A_2_08.jpeg', 'IMG_A_2_09.jpeg', 'IMG_A_2_10.jpeg'] },
  VitraDesignMuseum01: { title: 'VITRA DESIGN MUSEUM 01', category: 'architecture', images: ['IMG_A_3_01.jpeg', 'IMG_A_3_02.jpeg', 'IMG_A_3_03.jpeg', 'IMG_A_3_04.jpeg', 'IMG_A_3_05.jpeg', 'IMG_A_3_06.jpeg', 'IMG_A_3_07.jpeg'] },
  VitraDesignMuseum02: { title: 'VITRA DESIGN MUSEUM 02', category: 'architecture', images: ['IMG_A_4_01.jpeg', 'IMG_A_4_02.jpeg', 'IMG_A_4_03.jpeg', 'IMG_A_4_04.jpeg', 'IMG_A_4_05.jpeg', 'IMG_A_4_06.jpeg', 'IMG_A_4_07.jpeg'] },
  NationalAthleticsCenter: { title: 'NATIONAL ATHLETICS CENTER, BUDAPEST', category: 'architecture', images: ['IMG_A_5_01.jpeg', 'IMG_A_5_02.jpeg', 'IMG_A_5_03.jpeg', 'IMG_A_5_04.jpeg', 'IMG_A_5_05.jpeg', 'IMG_A_5_06.jpeg', 'IMG_A_5_07.jpeg', 'IMG_A_5_08.jpeg', 'IMG_A_5_09.jpeg', 'IMG_A_5_10.jpeg', 'IMG_A_5_11.jpeg', 'IMG_A_5_12.jpeg', 'IMG_A_5_13.jpeg', 'IMG_A_5_14.jpeg', 'IMG_A_5_15.jpeg'] },
  NewYork: { title: 'NEW YORK', category: 'architecture', images: ['IMG_A_2_01.jpeg', 'IMG_A_2_02.jpeg', 'IMG_A_2_03.jpeg', 'IMG_A_2_04.jpeg', 'IMG_A_2_05.jpeg', 'IMG_A_2_06.jpeg', 'IMG_A_2_07.jpeg', 'IMG_A_2_08.jpeg', 'IMG_A_2_09.jpeg', 'IMG_A_2_10.jpeg'] },
  NewYork: { title: 'NEW YORK', category: 'architecture', images: ['IMG_A_2_01.jpeg', 'IMG_A_2_02.jpeg', 'IMG_A_2_03.jpeg', 'IMG_A_2_04.jpeg', 'IMG_A_2_05.jpeg', 'IMG_A_2_06.jpeg', 'IMG_A_2_07.jpeg', 'IMG_A_2_08.jpeg', 'IMG_A_2_09.jpeg', 'IMG_A_2_10.jpeg'] }
};

    const CATEGORY_LABELS = { architecture: 'Architecture', people: 'People', motion: 'Motion' };

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('p');
    const project = PROJECTS[slug];

    const titleEl = document.getElementById('projectTitle');
    const montageEl = document.getElementById('montage');
    const backLink = document.getElementById('backLink');

    if (project) {
      titleEl.textContent = project.title;
      backLink.href = project.category + '.html';
      backLink.textContent = '← ' + (CATEGORY_LABELS[project.category] || project.category);
      project.images.forEach(fname => {
        const cell = document.createElement('div');
        cell.className = 'm-cell';
        const img = document.createElement('img');
        img.src = src(fname);
        cell.appendChild(img);
        montageEl.appendChild(cell);
      });
    } else {
      titleEl.textContent = 'Project not found';
    }
  </script>
</body>
</html>
